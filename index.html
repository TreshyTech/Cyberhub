<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="A personal cybersecurity learning and portfolio command centre.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>CyberHub — Learning Command Centre</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard" aria-label="CyberHub home">
      <span class="brand-mark">⌁</span><span><b>CYBERHUB</b><small>LEARNING COMMAND CENTRE</small></span>
    </a>
    <div class="profile-mini"><div class="avatar">T</div><div><b>My learning space</b><small>Personal workspace</small></div></div>
    <nav class="nav">
      <span class="nav-label">WORKSPACE</span>
      <button class="nav-item active" data-view="dashboard"><span>◫</span> Dashboard</button>
      <button class="nav-item" data-view="roadmaps"><span>⌘</span> Roadmap explorer</button>
      <button class="nav-item" data-view="assessment"><span>✓</span> Knowledge check</button>
      <button class="nav-item" data-view="projects"><span>▣</span> Project laboratory</button>
      <button class="nav-item" data-view="resources"><span>↗</span> Resource library</button>
      <button class="nav-item" data-view="skills"><span>◈</span> Skills tracker</button>
      <span class="nav-label">MY PROGRESS</span>
      <button class="nav-item" data-view="planner"><span>▦</span> Study planner</button>
      <button class="nav-item" data-view="journal"><span>✎</span> Learning journal</button>
      <button class="nav-item" data-view="career"><span>✧</span> Career & certifications</button>
      <button class="nav-item" data-view="progress"><span>◷</span> Progress & achievements</button>
      <span class="nav-label">PREFERENCES</span>
      <button class="nav-item" data-view="settings"><span>⚙</span> Settings & backup</button>
    </nav>
    <div class="sidebar-bottom"><div class="status-dot"></div><span>Saved on this device</span><small>v1.0.0</small></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
      <div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="pageName">Dashboard</strong></div>
      <div class="top-actions"><span class="today" id="todayLabel"></span><button class="icon-btn" id="themeToggle" title="Toggle theme">☼</button><button class="avatar small" title="Personal workspace">T</button></div>
    </header>
    <div class="content" id="content"></div>
    <footer>CYBERHUB <span>•</span> Built for consistent learning, safe practice and evidence-based skills.</footer>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="modal"><div class="modal-head"><h3 id="modalTitle">Details</h3><button class="icon-btn" id="modalClose">×</button></div><div id="modalBody"></div></dialog>
<script src="./app.js"></script>
</body>
</html>
